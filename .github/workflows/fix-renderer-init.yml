name: Fix renderer initialization

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix renderer initialization order
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/renderer/app.js')
          s = p.read_text(encoding='utf-8')
          old = "  (async()=>{try{const p=normalizeProfile(await window.biner.getProfile());if(p)state={...defaults,...p};render();bind();await server();await loadVersions()}catch(e){console.error(e);toast(`خطای راه‌اندازی رابط: ${e?.message||e}`)}})()"
          new = "  bind()\n  ;(async()=>{try{const p=normalizeProfile(await window.biner.getProfile());if(p)state={...defaults,...p};render();await server();await loadVersions()}catch(e){console.error(e);toast(`خطای راه‌اندازی رابط: ${e?.message||e}`)}})()"
          if old not in s:
              raise SystemExit('Target initialization block not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer/app.js
          git diff --cached --quiet && exit 0
          git commit -m "fix: bind launcher controls before async initialization"
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/fix-renderer-init.yml
          git commit -m "chore: remove temporary renderer fix workflow"
          git push
